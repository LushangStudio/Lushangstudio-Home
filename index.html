<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>路上工作室 · 应用中心</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="./" class="brand">路上工作室</a>
      <span class="edition">LUSHANG STUDIO</span>
    </header>
    <main>
      <section class="board">
        <div class="bar">
          <h2>
            全部应用
            <span id="count"></span>
          </h2>
          <label>
            <span class="sr-only">搜索应用</span>
            <input id="search" type="search" placeholder="搜索应用…" />
          </label>
        </div>
        <div id="apps" class="apps"></div>
        <p id="empty" hidden>没有找到匹配的应用。</p>
      </section>
    </main>
    <footer>
      <span>路上工作室</span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
