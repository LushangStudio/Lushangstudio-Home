<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>路上工作室 · 应用中心</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="./" class="brand">
        <span class="mark">路</span>
        路上工作室
      </a>
      <span class="edition">LUSHANG STUDIO</span>
    </header>
    <main>
      <section class="intro">
        <span class="eyebrow">为校园日常，留出更多时间</span>
        <h1>你的校园工作台。</h1>
        <p>从文字整理到请假申请，让每一件小事更轻松。</p>
      </section>
      <section class="board">
        <div class="bar">
          <h2>
            全部应用
            <span id="count"></span>
          </h2>
          <label>
            <span class="sr-only">搜索应用</span>
            <input id="search" type="search" placeholder="搜索应用…" />
          </label>
        </div>
        <div id="apps" class="apps"></div>
        <p id="empty" hidden>没有找到匹配的应用。</p>
      </section>
      <aside>
        <span class="spark">✦</span>
        <div>
          <b>工具会生长，入口始终在这里。</b>
          <p>更多校园服务，将陆续加入工作台。</p>
        </div>
      </aside>
    </main>
    <footer>
      <span>路上工作室</span>
      <span>让技术回到日常。</span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
